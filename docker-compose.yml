services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PGHOST: postgres
      REDIS_HOST: redis
      # Системное время контейнера = Минск (для читаемых логов; на расчёт расписания
      # не влияет — планировщик считает в Europe/Minsk через luxon явно).
      TZ: Europe/Minsk
    # Приёмник итогов от расширения Chrome (Веха 3, ext-6). Порт по умолчанию открыт
    # ТОЛЬКО на localhost сервера: наружу его выставляет человек осознанно (через
    # обратный прокси с TLS либо сменой EXT_REPORT_BIND на 0.0.0.0). Сама служба
    # внутри контейнера не поднимается, пока не задан EXT_REPORT_SECRET.
    ports:
      - '${EXT_REPORT_BIND:-127.0.0.1}:${EXT_REPORT_PORT:-8080}:${EXT_REPORT_PORT:-8080}'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-bron}
      POSTGRES_PASSWORD: ${PGPASSWORD:-bron}
      POSTGRES_DB: ${PGDATABASE:-bron}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGUSER:-bron}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
