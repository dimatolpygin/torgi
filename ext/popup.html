<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Бронь — Комаровка</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="card">
      <div class="label">До подачи</div>
      <div id="countdown" class="countdown">--:--:--</div>
      <div id="target" class="target">&nbsp;</div>
    </div>

    <!-- Главное и единственное, что человек обязан прочитать: что делать прямо сейчас. -->
    <div id="status" class="status status-wait">Открываю страницу подачи…</div>

    <!-- Что уйдёт в полночь — одной фразой, без внутренностей запроса. -->
    <div id="plan" class="plan">
      <div id="plan-text" class="plan-text">—</div>
    </div>

    <div id="outcome" class="plan outcome">
      <div class="label">Итог ночи</div>
      <div id="outcome-text" class="plan-text">—</div>
    </div>

    <!-- Появляется, только когда что-то пошло не так: одна просьба и одна кнопка. -->
    <div id="trouble" class="trouble">
      <div id="trouble-text" class="trouble-text">—</div>
      <button id="copy-btn" class="copy-btn" type="button">Скопировать, что видит расширение</button>
      <div id="copy-done" class="copy-done"></div>
    </div>

    <!-- Строка часов появляется, только если часы сбиты настолько, что это важно. -->
    <div id="clock-warn" class="warn"></div>

    <div id="account" class="foot"></div>

    <div class="foot">
      Не закрывайте эту вкладку до полуночи.
    </div>

    <script src="lib/minsk.js"></script>
    <script src="lib/account.js"></script>
    <script src="lib/guard.js"></script>
    <script src="lib/order.js"></script>
    <script src="lib/clock.js"></script>
    <script src="lib/shot.js"></script>
    <script src="lib/outcome.js"></script>
    <script src="config.js"></script>
    <script src="clocksync.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
